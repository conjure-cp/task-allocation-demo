version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    ignore:
      # Next's import, JSX accessibility, and React plugins still require ESLint 9.
      - dependency-name: "eslint"
        update-types:
          - "version-update:semver-major"
    assignees:
      - "ozgurakgun"
   # groups:
   #   all-npm-packages:
   #     patterns:
   #       - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: monthly
    assignees:
      - ozgurakgun
    labels:
      - "dependencies"
      - "dependencies::ci"
